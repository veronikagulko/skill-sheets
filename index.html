<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ECP Psychomotor Skill Sheets</title>
  <style>
    :root{
      --red:#c62828;
      --text:#111;
      --muted:#555;
      --card:#ffffff;
      --border:#e6e6e6;
      --shadow: 0 8px 24px rgba(0,0,0,.08);
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background:#fff;
      line-height:1.4;
    }
    header{ background:var(--red); color:#fff; padding:24px 16px; }
    .wrap{ max-width:980px; margin:0 auto; }
    .banner-title{ margin:0; font-size:28px; font-weight:800; letter-spacing:.2px; }
    .banner-sub{
      margin:8px 0 0; font-size:14px; opacity:.95;
      display:flex; flex-wrap:wrap; gap:14px; align-items:center;
    }
    .pill{
      background:rgba(255,255,255,.18);
      border:1px solid rgba(255,255,255,.22);
      padding:6px 10px; border-radius:999px; font-weight:600;
    }
    main{ padding:28px 16px 48px; }
    h2{ margin:0 0 6px; font-size:22px; }
    .note{ margin:0 0 18px; color:var(--muted); font-size:14px; }
    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:14px;
      box-shadow:var(--shadow);
      padding:18px;
    }
    .divider{ border:0; border-top:1px solid var(--border); margin:28px 0 0; }

    /* Class buttons row */
    .class-grid{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap:12px;
      margin:0 0 18px;
    }
    .class-btn{
      width:100%;
      border:1px solid var(--border);
      border-radius:14px;
      background:#fff;
      box-shadow:var(--shadow);
      padding:16px 14px;
      font-weight:800;
      font-size:16px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      transition: transform .05s ease, border-color .15s ease, background .15s ease;
    }
    .class-btn:hover{ border-color:#cfcfcf; background:#fafafa; transform: translateY(-1px); }
    .class-btn[aria-pressed="true"]{
      outline:3px solid rgba(198,40,40,.25);
      border-color: rgba(198,40,40,.55);
      background:#fff;
    }

    /* Dropdown panel */
    .dropdown{ display:none; margin:-6px 0 18px; }
    .dropdown.open{ display:block; }
    .dropdown-inner{
      border:1px solid var(--border);
      border-radius:14px;
      box-shadow:var(--shadow);
      background:#fff;
      padding:14px;
    }

    /* Sub-tabs (only used for class 5698) */
    /* Sub-tabs (5968 only) */
      .sheet-tabs{
      display:flex;
      width:100%;
      gap:12px;
      margin:10px 0 16px;
      flex-wrap:nowrap;     /* prevents stacking/shrinking weirdness */
    }

    .tab-btn{
      flex:1 1 0;           /* force equal widths */
      min-width:0;          /* allows flex items to actually shrink evenly */
      width:100%;
      border:1px solid var(--border);
      background:#fff;
      border-radius:12px;
      padding:12px 0;
      cursor:pointer;
      font-weight:800;
      font-size:14px;
      text-align:center;
    }
    #sheetTabs .tab-btn{ flex:1 1 0 !important; width:100% !important; }

      .tab-btn:hover{
        border-color:#cfcfcf;
        background:#fafafa;
        transform: translateY(-1px);
      }

      .tab-btn[aria-pressed="true"]{
        outline:3px solid rgba(198,40,40,.18);
        border-color: rgba(198,40,40,.45);
        background:#fff;
      }

    /* Roster list */
    .roster{
      list-style:none;
      padding:0;
      margin:0;
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap:12px;
    }
    .roster a{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:12px 14px;
      border:1px solid var(--border);
      border-radius:12px;
      text-decoration:none;
      color:var(--text);
      transition: transform .05s ease, border-color .15s ease, background .15s ease;
      background:#fff;
    }
    .roster a:hover{ border-color:#cfcfcf; background:#fafafa; transform: translateY(-1px); }
    .name{ font-weight:700; }
    .small{ font-size:12px; color:var(--muted); font-weight:600; white-space:nowrap; }

    /* Close button in dropdown */
    .dropdown-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom:8px;
    }
    .close-btn{
      border:1px solid var(--border);
      background:#fff;
      border-radius:10px;
      padding:8px 10px;
      cursor:pointer;
      font-weight:800;
      line-height:1;
    }
    .close-btn:hover{ background:#fafafa; border-color:#cfcfcf; }
  </style>
</head>

          { name: "Tzvi Spira", url: "https://docs.google.com/document/d/1qmC4WpI6J7YZ7JKZMmj2fPpixQryXBhEatWa9mUxEgI/edit?usp=sharing" },
          { name: "Hillel Stern", url: "https://docs.google.com/document/d/1eoEQstd8OewpyjmLOS-LHBEPy1C-10lm7tnOaH-JcAM/edit?usp=sharing" },
          { name: "Eliyahu Sutton", url: "https://docs.google.com/document/d/1ETEMmR4vKsLyCdpz7g9uPvvQP2YvwHLRt7v-bKABA1Y/edit?usp=sharing" },
          { name: "Issac Sutton", url: "https://docs.google.com/document/d/1riMP0FgRGr2piD0fEP4h8y15hdIdyMxDHlZ80qm5g1c/edit?usp=sharing" },
          { name: "Isaac Trebits", url: "https://docs.google.com/document/d/1QvYwJBtIA1zf_I9CytotmR5M2BcyF_JGRcq3rX8koho/edit?usp=sharing" },
          { name: "Avraham Tuchman", url: "https://docs.google.com/document/d/1VOvrWdY81DqaU8XUiYbj9MjRExxjm1nAONdKON4MQ6o/edit?usp=sharing" },
          { name: "Moshe D. Urbach", url: "https://docs.google.com/document/d/1fnMD5eTcoyGXdXnHJkF1HH4dTb0uTmSDfSUk-pVQRyU/edit?usp=sharing" },
          { name: "Rafael M. Wilhelm", url: "https://docs.google.com/document/d/1y1LrddobZwXsxvd08MX0lIc3b9XBTc2_LK45x5mDl94/edit?usp=sharing" }
        ], // currently empty; put the real roster here when you have it
        cpr: [
          { name: "Alexander Ashkenazi", url: "https://docs.google.com/document/d/19rHzm47L6s5tmLagezKZQOMcIYUQQTDQwG5NtDzLjZo/edit?usp=sharing" },
          { name: "Yechiel Ausch", url: "https://docs.google.com/document/d/1YJdRwqtQLKhV3vBcO_Gg67vs_l4e1kWfZdjMjXAW-kA/edit?usp=sharing" },
          { name: "Alexander A. Blum", url: "https://docs.google.com/document/d/1N59tU-50CW3TjtnCktYW35Q5D_vgL84vN5q_4PuWfG0/edit?usp=sharing" },
          { name: "Eliyahu Cisner", url: "https://docs.google.com/document/d/17Vl6GoapHO1PhkawVuF-HdvpD7zUH6el4KSNZfo6Ho4/edit?usp=sharing" },
          { name: "Samuel J. David", url: "https://docs.google.com/document/d/1S8ErMMcr7q3Gae0eBn1Du6l8Jo7QzYbzAeF5mhKuBCg/edit?usp=sharing" },
          { name: "Menache Fischman", url: "https://docs.google.com/document/d/1el7OAwSM6WU2TmxQSnsyXPgV3LY1y-d5ZdoonWc3sXo/edit?usp=sharing" },
          { name: "Yisroel D. Haining", url: "https://docs.google.com/document/d/1Yx9SaOx-zu6MmlMzSa4VFsbp-lV6q02hP2LimD0AZk4/edit?usp=sharing" },
          { name: "Zev Klein", url: "https://docs.google.com/document/d/14UU2EyNz3EHkwWkLCUA-2w1I4uogrJ2eRliWhlv7kho/edit?usp=sharing" },
          { name: "Yehuda Reiner", url: "https://docs.google.com/document/d/1YoiCB-iBylyaCtDWOFCgmiLgHiiwdLNnk0qrFaMtDyQ/edit?usp=sharing" },
          { name: "Yaakov Silverman", url: "https://docs.google.com/document/d/1lATFKRIVdNGfn9yp85ToiTaJg-eub5I0JUpjLAOpLV8/edit?usp=sharing" },
          { name: "Tzvi Spira", url: "https://docs.google.com/document/d/1bgtNkgCIoTEZkzr4SudoI98e1OrlGPOTwP2bxn89G9k/edit?usp=sharing" },
          { name: "Hillel Stern", url: "https://docs.google.com/document/d/1fT2IV7si0jOVQicjazKJuw5TNT4GxaEKWRwkQjkilxI/edit?usp=sharing" },
          { name: "Eliyahu Sutton", url: "https://docs.google.com/document/d/1FVbnBwvA8U56r-r1zLTyVGE5Qut9UEc41TEHPFJhhyM/edit?usp=sharing" },
          { name: "Issac Sutton", url: "https://docs.google.com/document/d/1JmC3Tlqc3ZwB9sOd0k7ZvTcmXz2AEC_u9Dj7hsctxaI/edit?usp=sharing" },
          { name: "Isaac Trebits", url: "https://docs.google.com/document/d/1pb0yenV8ftVAYMl21TJeDHXAEC4fmwXt9nDjAp_z3Qs/edit?usp=sharing" },
          { name: "Avraham Tuchman", url: "https://docs.google.com/document/d/1jiMnqKwOWyeHSn3Te1GRFtbv06EoLhxRbDVXhgzKr_8/edit?usp=sharing" },
          { name: "Moshe D. Urbach", url: "https://docs.google.com/document/d/1r5f-9swrd0A7gHY9RQ_giSFi-LvxtJTaxa9oCvVZ4AY/edit?usp=sharing" },
          { name: "Rafael M. Wilhelm", url: "hhttps://docs.google.com/document/d/1XG82gXDh7X_hq1G0MEpMsrmJ4LtEH7IhpJDA0ztChfE/edit?usp=sharing" }
        ]
      }
    };

    const dropdown = document.getElementById("dropdown");
    const rosterList = document.getElementById("rosterList");
    const classTitle = document.getElementById("classTitle");
    const classPill  = document.getElementById("classPill");
    const sheetPill  = document.getElementById("sheetPill");
    const rosterNote = document.getElementById("rosterNote");
    const buttons = Array.from(document.querySelectorAll(".class-btn"));
    const closeBtn = document.getElementById("closeBtn");

    // Tabs (5698 only)
    const sheetTabs = document.getElementById("sheetTabs");
    const tabPsy = document.getElementById("tabPsy");
    const tabCpr = document.getElementById("tabCpr");

    let activeClassId = null;
    let activeSheet = "psychomotor"; // psychomotor | cpr

    function getRosterFor(classId){
      if(classId === "5698"){
        return (sheetRosters["5698"]?.[activeSheet]) || [];
      }
      return classes[classId] || [];
    }

    function setHeaderFor(classId){
      classPill.textContent = `Class: ${classId}`;

      if(classId === "5698"){
        const pretty = activeSheet === "cpr" ? "CPR Skill Sheets" : "Psychomotor Skill Sheets";
        sheetPill.textContent = pretty;
        classTitle.textContent = `ECP Class #${classId} — ${pretty}`;

        rosterNote.textContent =
          activeSheet === "cpr"
            ? "Select your CPR skill sheet here."
            : "You can view your progress on your psychomotor skill sheets here. These are updated daily on my end, so do not worry if something looks missing.";

        sheetTabs.style.display = "flex";
        tabPsy.setAttribute("aria-pressed", String(activeSheet === "psychomotor"));
        tabCpr.setAttribute("aria-pressed", String(activeSheet === "cpr"));
      } else {
        sheetPill.textContent = "Psychomotor Skill Sheets";
        classTitle.textContent = `ECP Class #${classId} — Psychomotor Skill Sheets`;
        rosterNote.textContent =
          "You can view your progress on your psychomotor skill sheets here. These are updated daily on my end, so do not worry if something looks missing.";
        sheetTabs.style.display = "none";
      }
    }

    function renderRoster(classId){
      setHeaderFor(classId);

      rosterList.innerHTML = "";
      const roster = getRosterFor(classId);

      if(roster.length === 0){
        const li = document.createElement("li");
        li.textContent = "No roster added yet for this selection.";
        rosterList.appendChild(li);
        return;
      }

      for(const student of roster){
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = student.url;
        a.target = "_blank";
        a.rel = "noopener";

        const nameSpan = document.createElement("span");
        nameSpan.className = "name";
        nameSpan.textContent = student.name;

        const smallSpan = document.createElement("span");
        smallSpan.className = "small";
        smallSpan.textContent = "Open sheet →";

        a.appendChild(nameSpan);
        a.appendChild(smallSpan);
        li.appendChild(a);
        rosterList.appendChild(li);
      }
    }

    function setPressed(activeId){
      for(const btn of buttons){
        btn.setAttribute("aria-pressed", String(btn.dataset.class === activeId));
      }
    }

    function syncUrl(){
      const url = new URL(window.location);
      if(activeClassId) url.searchParams.set("class", activeClassId);
      else url.searchParams.delete("class");

      if(activeClassId === "5698") url.searchParams.set("sheet", activeSheet);
      else url.searchParams.delete("sheet");

      window.history.replaceState({}, "", url);
    }

    function openDropdown(classId){
      activeClassId = classId;

      // default sheet when opening 5698
      if(classId === "5698" && !["psychomotor","cpr"].includes(activeSheet)) activeSheet = "psychomotor";
      if(classId !== "5698") activeSheet = "psychomotor";

      renderRoster(classId);
      setPressed(classId);
      dropdown.classList.add("open");
      syncUrl();
    }

    function closeDropdown(){
      dropdown.classList.remove("open");
      for(const btn of buttons) btn.setAttribute("aria-pressed","false");

      activeClassId = null;
      activeSheet = "psychomotor";
      syncUrl();

      classPill.textContent = "Choose a class";
      sheetPill.textContent = "Psychomotor Skill Sheets";
      classTitle.textContent = "ECP Psychomotor Skill Sheets";
    }

    // Class buttons
    buttons.forEach(btn => {
      btn.addEventListener("click", () => {
        const classId = btn.dataset.class;

        const isOpenForThis =
          dropdown.classList.contains("open") &&
          btn.getAttribute("aria-pressed") === "true";

        if(isOpenForThis) closeDropdown();
        else openDropdown(classId);
      });
    });

    // Tabs (5698 only)
    tabPsy.addEventListener("click", () => {
      if(activeClassId !== "5698") return;
      activeSheet = "psychomotor";
      renderRoster("5698");
      syncUrl();
    });

    tabCpr.addEventListener("click", () => {
      if(activeClassId !== "5698") return;
      activeSheet = "cpr";
      renderRoster("5698");
      syncUrl();
    });

    closeBtn.addEventListener("click", closeDropdown);

    // Load from URL param if present
    const params = new URLSearchParams(window.location.search);
    const initialClass = params.get("class");
    const initialSheet = params.get("sheet");

    if(initialClass){
      activeSheet = (initialClass === "5698" && (initialSheet === "cpr" || initialSheet === "psychomotor"))
        ? initialSheet
        : "psychomotor";

      // allow opening even if roster array is empty; we just show "No roster added yet..."
      openDropdown(initialClass);
    }
  </script>
